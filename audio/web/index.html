<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#18212b" />
    <title>本地音频库</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section id="login-panel" class="panel login-panel">
        <h2>进入音频库</h2>
        <p>输入共享访问密钥后开始播放。</p>
        <form id="login-form">
          <label for="access-key">访问密钥</label>
          <div class="input-row">
            <input
              id="access-key"
              name="key"
              type="password"
              autocomplete="current-password"
              required
            />
            <button type="submit">进入</button>
          </div>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="player-panel" class="panel player-panel hidden">
        <div class="now-playing">
          <span class="section-label">NOW PLAYING</span>
          <h2 id="current-title">尚未选择音频</h2>
          <p id="current-status">从下方列表选择一个音频开始播放。</p>
        </div>
        <audio id="audio-player" controls preload="metadata"></audio>
        <div class="transport-controls" aria-label="播放列表控制">
          <button id="previous-button" class="secondary-button" type="button">
            上一个
          </button>
          <button id="next-button" class="secondary-button" type="button">
            下一个
          </button>
        </div>
      </section>

      <section id="library-panel" class="panel library-panel hidden">
        <div class="section-heading">
          <div>
            <span class="section-label">LIBRARY</span>
            <h2>音频列表</h2>
          </div>
          <button id="refresh-button" class="secondary-button" type="button">
            刷新
          </button>
        </div>
        <p id="library-status" class="muted">正在扫描音频库……</p>
        <div id="audio-list" class="audio-list"></div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
