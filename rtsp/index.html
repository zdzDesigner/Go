<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>WebCodecs H.264 WebSocket Player (Fixed Annex B)</title>
    <style>
      body {
        background: #1a1a1a;
        color: #fff;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }
      canvas {
        background: #000;
        border: 1px solid #333;
        max-width: 100%;
        max-height: 80vh;
      }
      .status {
        margin-top: 15px;
        font-size: 14px;
        color: #aaa;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h2>WebCodecs 实时视频流 (Annex B 模式)</h2>
    <canvas id="videoCanvas" width="640" height="480"></canvas>
    <div id="status" class="status">等待连接...</div>

    <script>
      const canvas = document.getElementById("videoCanvas")
      const ctx = canvas.getContext("2d")
      const statusDiv = document.getElementById("status")

      // ==========================================
      // 全局变量配置
      // ==========================================
      let decoder = null
      let isDecoderConfigured = false
      let savedSPS = null
      let savedPPS = null

       // H.264 Codec 字符串
       // 从SPS数据中推导出的默认值，用于在尚未收到SPS时的初始化
       let codecString = "avc1.42E01E" // 默认 baseline profile

      // ==========================================
      // 辅助：处理时间戳 (确保是微秒，并且相对基准，避免过大的时间戳值)
      // ==========================================
      let baseTimestamp = null
      
       function getMicroseconds(ts) {
         // 如果时间戳非常小（小于 10000），可能是毫秒，需要 * 1000
         if (ts < 10000) {
           ts = ts * 1000
         }
         // 如果时间戳非常大（大于 1e16，即纳秒），需要 / 1000
         // 1秒 = 1,000,000 微秒 = 1,000,000,000 纳秒
         if (ts > 1e16) {
           ts = ts / 1000
         }
         // 设置基准时间戳（首次调用时），或者使用已经设置的基准
         if (baseTimestamp === null) {
           baseTimestamp = ts
           return 0 // 从0开始计时
         }
         
         // 返回相对于基准的时间戳，避免使用过大的数值
         const relativeTs = ts - baseTimestamp
         
         // 如果相对时间戳为负，说明时间戳混乱或重置，重新设置基准
         if (relativeTs < 0) {
           baseTimestamp = ts
           return 0
         }
         
         return relativeTs
       }
       
       // 从SPS数据推导codec字符串
       function deriveCodecString(sps) {
         if (!sps || sps.length < 4) {
           return codecString // 返回默认值
         }
         
         // H.264 SPS NALU结构: [起始码(可能有)][NAL Header(0x67)][profile_idc][constraint_set_x_flag][level_idc]...
         // 跳过NALU header (0x67) 和可能的起始码，找到实际的SPS参数
         try {
           // 遍历数组寻找NALU单元开始
           let offset = 0;
           
           // 如果数据以起始码开始，需要跳过
           if (sps.length >= 5 && sps[0] === 0 && sps[1] === 0 && sps[2] === 0 && sps[3] === 1) {
             offset = 4; // 跳过 00 00 00 01 起始码
           } else if (sps.length >= 4 && sps[0] === 0 && sps[1] === 0 && sps[2] === 1) {
             offset = 3; // 跳过 00 00 01 起始码
           }
           
           // 现在sps[offset]应该是NALU类型 (0x67 for SPS)
           if (sps.length > offset + 3) {
             const profile_idc = sps[offset + 1]; // Profile IDC
             const level_idc = sps[offset + 3];   // Level IDC
             
             // 使用十六进制格式组装codec字符串: avc1.profile_level (6位十六进制)
             const profileHex = profile_idc.toString(16).padStart(2, '0').toUpperCase();
             const levelHex = level_idc.toString(16).padStart(2, '0').toUpperCase();
             
             // 只使用profile_idc和level_idc构建标准的codec字符串
             codecString = `avc1.${profileHex}00${levelHex}`;
             console.log(`根据SPS推导出的codec: ${codecString}`);
             return codecString;
           }
         } catch (e) {
           console.warn("无法从SPS推导codec字符串，使用默认值:", e);
         }
         
         return codecString; // 返回默认值
       }

      // ==========================================
      // 1. 初始化/重建 VideoDecoder
      // ==========================================
      function ensureDecoderReady() {
        if (decoder && decoder.state === "closed") {
          console.warn("⚠️ 检测到 Decoder 已关闭，准备重建...")
          decoder = null
          isDecoderConfigured = false
        }

        if (!decoder) {
          decoder = new VideoDecoder({
            output: (frame) => {
              if (
                canvas.width !== frame.displayWidth ||
                canvas.height !== frame.displayHeight
              ) {
                canvas.width = frame.displayWidth
                canvas.height = frame.displayHeight
                console.log(`画布尺寸更新: ${canvas.width}x${canvas.height}`)
              }
              ctx.drawImage(frame, 0, 0)

              frame.close()
            },
            error: (e) => {
              console.error("❌ VideoDecoder 内部错误:", e)
              statusDiv.innerText = "解码错误: " + e.message
              // 如果是因为配置问题，强制重置
              isDecoderConfigured = false
            },
          })
          console.log("✅ 新的 VideoDecoder 已创建")
        }
        return decoder
      }



      // ==========================================
      // 2. 尝试配置解码器 (修复版：不使用 description)
      // ==========================================
      async function tryConfigureDecoder(currentDecoder) {
        if (isDecoderConfigured) return true

        // 如果还没收到 SPS/PPS，我们也可以尝试直接配置 codec，
        // 但为了稳妥，这里依然等待 SPS，确保流是活的。
        if (!savedSPS || !savedPPS) {
          statusDiv.innerText = "等待 SPS/PPS 配置信息..."
          return false
        }

        try {
          // 核心修复：
          // 对于 Annex B 格式（带起始码 00 00 00 01）的流，通常不需要 description。
          // 浏览器会自动从码流中解析 SPS/PPS。
          // 我们只需要指定 codec 字符串。

           // 从SPS数据推导codec字符串
           const derivedCodec = deriveCodecString(savedSPS)
           const config = {
             codec: derivedCodec,
             // 注意：这里没有 description 属性！
             optimizeForLatency: true,
           }

          // 检查支持情况
          const support = await VideoDecoder.isConfigSupported(config)
          if (!support.supported) {
            console.error("浏览器不支持该配置:", config)
            statusDiv.innerText = "浏览器不支持该配置 (请检查 Codec 字符串)"
            return false
          }

          await currentDecoder.configure(config)
          isDecoderConfigured = true
          statusDiv.innerText = "解码器配置成功 (Annex B 自动模式)"
          console.log("🚀 解码器配置成功", config)
          return true
        } catch (e) {
          console.error("配置失败:", e)
          statusDiv.innerText = "解码器配置失败: " + e.message
          return false
        }
      }

      // ==========================================
      // 3. WebSocket 连接与主循环
      // ==========================================
      const wsUrl = "ws://localhost:8080/ws"
      const socket = new WebSocket(wsUrl)
      socket.binaryType = "arraybuffer"

      socket.onopen = () => {
        statusDiv.innerText = "WebSocket 已连接"
      }

      socket.onclose = () => {
        statusDiv.innerText = "连接已断开"
        isDecoderConfigured = false
      }

      socket.onerror = (err) => {
        console.error("WebSocket 错误:", err)
      }

      // ==========================================
      // 解析二进制帧消息
      // 格式: [1byte flags][8bytes timestamp big-endian][H264 data...]
      // flags: bit0 = isKey
      // ==========================================
      function parseBinaryFrame(arrayBuffer) {
        const view = new DataView(arrayBuffer)
        const flags = view.getUint8(0)
        const isKey = (flags & 1) !== 0
        // 读取8字节大端序时间戳（微秒）
        const timestampHi = view.getUint32(1, false)
        const timestampLo = view.getUint32(5, false)
        const timestamp = timestampHi * 0x100000000 + timestampLo
        const h264Data = new Uint8Array(arrayBuffer, 9)
        return { isKey, timestamp, h264Data }
      }

      // 解码队列深度阈值，超过此值丢弃帧以控制延迟
      // 硬件解码管线天然积攒2-4帧，阈值过小会频繁误触发丢帧
      // 注意：必须 GOP-aware 丢帧（丢 P 帧后要等下一个关键帧），
      // 否则解码器基于缺失的参考帧产生残影
      const MAX_DECODE_QUEUE_SIZE = 15
      let clientNeedKeyframe = false

      socket.onmessage = async (event) => {
        // --- A. 解析二进制消息（零拷贝，无JSON/Base64开销）---
        let msg
        try {
          msg = parseBinaryFrame(event.data)
        } catch (e) {
          console.error("二进制帧解析失败", e)
          return
        }

        const { isKey, timestamp, h264Data } = msg

        if (isKey) {
          console.log("收到关键帧, dataLen:", h264Data.length)
        }

        // --- B. 解析 NALU (仅用于收集 SPS/PPS) ---
        if (h264Data.length > 4) {
          const naluHeader = h264Data[4]
          const naluType = naluHeader & 0x1f
          // console.log({ naluType });

          if (naluType === 7) {
            if (!savedSPS) console.log("收到 SPS")
            savedSPS = h264Data
          } else if (naluType === 8) {
            if (!savedPPS) console.log("收到 PPS")
            savedPPS = h264Data
          }
        }

        // --- C. 确保 Decoder 准备就绪 ---
        const currentDecoder = ensureDecoderReady()

        // 尝试配置
        const configSuccess = await tryConfigureDecoder(currentDecoder)
        if (!configSuccess) {
          // 如果还没配置好，这帧数据丢弃或暂存（这里简单丢弃）
          return
        }

        // --- D. 解码（GOP-aware 背压控制）---
        if (isDecoderConfigured && currentDecoder.state === "configured") {
          // 如果之前因队列积压丢过帧，必须等下一个关键帧才能恢复解码
          // 否则 P 帧基于缺失的参考帧会产生残影
          if (clientNeedKeyframe) {
            if (!isKey) {
              return // 丢弃 P 帧，等待关键帧
            }
            // 关键帧到了，reset 解码器丢弃积压帧和旧参考帧状态
            console.warn("客户端: 收到关键帧，从丢帧状态恢复")
            try {
              currentDecoder.reset()
              isDecoderConfigured = false
              const ok = await tryConfigureDecoder(currentDecoder)
              if (!ok) return
            } catch (e) {
              console.warn("reset/reconfigure 异常:", e)
              return
            }
            clientNeedKeyframe = false
            baseTimestamp = null
          }

          // 背压: 队列太长 → 进入等待关键帧状态
          if (currentDecoder.decodeQueueSize > MAX_DECODE_QUEUE_SIZE) {
            console.warn("解码队列积压，进入等待关键帧状态, queueSize:", currentDecoder.decodeQueueSize)
            clientNeedKeyframe = true
            if (!isKey) {
              return // 丢弃当前 P 帧
            }
            // 当前就是关键帧，reset 后直接解码
            try {
              currentDecoder.reset()
              isDecoderConfigured = false
              const ok = await tryConfigureDecoder(currentDecoder)
              if (!ok) return
            } catch (e) {
              console.warn("reset/reconfigure 异常:", e)
              return
            }
            clientNeedKeyframe = false
            baseTimestamp = null
          }

          const chunkType = isKey ? "key" : "delta"

          // 修正时间戳
          const ts = getMicroseconds(timestamp)

          const chunk = new EncodedVideoChunk({
            type: chunkType,
            timestamp: ts,
            data: h264Data, // 直接发送 Annex B 数据 (00 00 00 01 ...)
          })

          try {
            currentDecoder.decode(chunk)
          } catch (err) {
            console.error("decode 调用失败:", err)
            // 出错时重置配置状态，尝试恢复
            isDecoderConfigured = false
          }
        }
      }
    </script>
  </body>
</html>
